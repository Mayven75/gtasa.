name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip projects
        run: for z in *.zip; do unzip -q "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: |
          for d in gtamc gtasa; do
            if [ -d "$d" ]; then (cd "$d" && gradle build --no-daemon); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            gtamc/build/libs/*.jar
            gtasa/build/libs/*.jar
